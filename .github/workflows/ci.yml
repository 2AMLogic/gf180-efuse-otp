name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache pinned Icarus 13.0 and Yosys 0.67
        id: eda
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/eda
          key: eda-iverilog-v13_0-yosys-v0.67-${{ hashFiles('scripts/ci/install_eda.sh') }}
      - name: Install pinned Icarus 13.0 and Yosys 0.67
        # Prerequisites and source build share the cache-miss condition: on a
        # hit the runner needs neither the apt packages nor the compile, and
        # the bench below proves that (no runtime package comes from apt).
        if: steps.eda.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake bison flex \
            gperf autoconf libreadline-dev gawk tcl-dev libffi-dev pkg-config zlib1g-dev
          PREFIX="$HOME/eda" scripts/ci/install_eda.sh
      - name: Put pinned tools on PATH
        run: echo "$HOME/eda/bin" >> "$GITHUB_PATH"
      - name: Install uv
        # verification/run.sh runs the bench through `uvx --from "$(cat
        # signoff/klt-pin.txt)" klt functional-verification`, never a
        # host-installed klt, so the two bench steps below need uv on PATH.
        # Fetching klt and the pinned cocotb needs network at job time; a fetch
        # failure must fail the step, so there is no retry or fallback here.
        run: pipx install uv

      - name: Controller bench
        run: verification/run.sh
      - name: Controller negative control
        run: verification/run.sh --negative-control
      - name: Latch check
        run: rtl/synth.sh
      - name: Latch negative control
        # Proves the latch gate can fail: synthesizes the committed
        # latch-bearing fixture through the same rtl/latch-assert.ys text the
        # gate asserts, and passes only if the assertion fires.
        run: rtl/synth.sh --negative-control

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        # layout/attest.sh (and every other generator in this repo) reaches the
        # pinned klt through `uvx --from "$(cat signoff/klt-pin.txt)"`, never a
        # host-installed one, so the item 2 check step below needs uv on PATH.
        run: pipx install uv

      - name: Install jq
        # sim/lib/test_pdk_env.sh (and the pdk_env.sh it exercises) parse JSON
        # with jq; no other harness step uses it, so install it explicitly
        # rather than assuming the runner image ships it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      - name: check:ci (hermetic checks)
        # The single source of the hermetic term list is
        # scripts/ci/check_ci.sh; package.json scripts["check:ci"] calls the
        # same script, so this job and the local gate run the identical list
        # by construction. One step instead of one per check: the script
        # prints a "==> <name>" line before each check, so a failure is read
        # from the log as the last such line. The steps below this one are
        # the tool-, PDK- or diff-base-dependent checks the script
        # deliberately omits.
        run: ./scripts/ci/check_ci.sh

      - name: Layout unit tests
        # The test_*.py modules under layout/ unit-test the code behind the
        # committed partition streams and the P&R that produced them
        # (dbu_export's shared final-write, row-cell placement, fill and
        # rollback), but CI never regenerates a stream, so their logic and
        # rejection paths have no other automated coverage. Discovery
        # (-p 'test_*.py', the same convention as scripts/ci/check_ci.sh)
        # picks up new modules without editing this file. Synthetic
        # in-memory fixtures only: no PDK, no OpenROAD, no committed stream.
        # Deliberately not part of scripts/ci/check_ci.sh, which runs under
        # the host python3 with no klayout binding -- a missing binding here
        # must fail this step.
        run: |
          . signoff/klt.sh
          klt_python -I -m unittest discover -s layout -p 'test_*.py' -v

      - name: Sim records append-only
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
          fi
          python3 scripts/ci/check_sim_append_only.py --base "$base"

      - name: Re-grade signoff record
        run: |
          . signoff/klt.sh
          rc=0
          klt signoff --manifest signoff/block-manifest.json \
            --format json > "$RUNNER_TEMP/regraded.json" || rc=$?
          # 0 = all met, 3 = report produced with items unmet (expected today)
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "klt signoff failed with exit $rc" >&2
            exit 1
          fi
          cmp "$RUNNER_TEMP/regraded.json" signoff/block-manifest.signoff.json

      - name: Item 10 attestation is current
        run: |
          . signoff/klt.sh
          klt signoff --attest 10 --inventory signoff/attest/item10.json \
            --check signoff/attest/item10.envelope.json

      - name: Item 9 attestation is current
        # Re-hashes the bench files and re-checks the pins; the cold-start command
        # is local_only (needs the PDK, ngspice, Icarus) and is not re-run here.
        run: |
          . signoff/klt.sh
          klt signoff --attest 9 --inventory signoff/attest/item9.json \
            --check signoff/attest/item9.envelope.json

      - name: Item 8 attestation is current
        # The item 8 envelope hashes signoff/block-manifest.signoff.json, so a
        # record regeneration without a re-attest leaves this envelope stale
        # (exit 3).
        run: |
          . signoff/klt.sh
          klt signoff --attest 8 --inventory signoff/attest/item8.json \
            --check signoff/attest/item8.envelope.json

      - name: Item 1 (analog) attestation reproduces
        # Re-hashes the schematics, symbols and netlist; the xschem freshness
        # check is local_only and is not re-run here (no xschem on the runner).
        run: |
          . signoff/klt.sh
          klt signoff --attest 1 --inventory signoff/item1-analog-inventory.json \
            --check signoff/item1-analog.attest.json

      - name: Item 2 attestations reproduce
        # Both item 2 envelopes, re-attested from the committed streams and
        # compared with `klt signoff --attest 2 --check` (exit 3 = stale). This
        # re-reads the streams and recomputes the digital geometry digest, so
        # editing a stream or an envelope without re-attesting fails. The
        # generators named in the regeneration claims are not run (they need
        # OpenROAD and the PDK); the claim stays attester-asserted, as the
        # grader treats it. Run through layout/attest.sh, which reads the
        # digest from the pinned klt's own `klt stats --format json` and
        # attests both envelopes in one step.
        run: layout/attest.sh --check

      - name: ERC supply report reproduces
        # klt erc --check on the committed item 11 (digital) report through
        # layout/erc.sh: re-hashes the stream, the supply spec and the deck
        # against the report's own provenance (exit 3 = drifted). Needs the
        # pinned klt via uvx only -- no PDK, no OpenROAD.
        run: layout/erc.sh --check

      - name: ERC supply spec negative control
        # Proves the supply spec gates on the stackup: a scratch copy with the
        # Metal4 strap layer removed must fragment both supplies
        # (erc.unconnected_net on VDD and VSS, exit 3).
        run: layout/erc.sh --negative-control

      - name: Committed streams have no unlanded via2
        # The deck does not model V2.3c/V2.3d/V2.4b/V2.4c, so this per-cell count
        # of via2 shapes with no M3 above or no M2 below is the only gate for
        # that class. Reads each committed stream (array, then ctrl) with the
        # pinned klt's python; no PDK or OpenROAD. This runs on the committed
        # streams and does not regenerate them; that a stream equals the
        # generator output is a local `regen-gds.sh --check` step, which CI
        # does not run.
        run: |
          layout/check_via2_landing.sh
          layout/check_via2_landing.sh layout/efuse_otp_ctrl.gds
